_format_version: "3.0"
_transform: true

services:
  # User Service
  - name: user-service
    host: user-service
    port: 8080
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: user-api
        strip_path: false
        preserve_host: false
        paths:
          - /users
          - /instructors
          - /members
          - /auth

  - name: user-service-docs
    service: user-service
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: user-swagger-ui
        strip_path: false
        preserve_host: false
        paths:
          - /swagger/user-service
    plugins:
      - name: ip-restriction
        config:
          allow:
            - 127.0.0.1 # your own machine (localhost)
            - 192.168.1.0/24

  # Core Service
  - name: core-service
    host: core-service
    port: 8080
    protocol: http
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: core-service-route
        strip_path: false
        preserve_host: false
        paths:
          - /cars
          - /packages
          - /articles
          - /testimonials
          - /v1/cars
          - /v1/packages
          - /v1/articles
          - /v1/testimonials

  - name: core-service-docs
    service: core-service
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: core-swagger-ui
        strip_path: false
        preserve_host: false
        paths:
          - /swagger/core-service

    plugins:
      - name: ip-restriction
        config:
          allow:
            - 127.0.0.1 # your own machine (localhost)
            - 192.168.1.0/24

  # Booking Service
  - name: booking-service
    host: booking-service
    port: 8080
    protocol: http
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: booking-service-route
        strip_path: true
        preserve_host: false
        paths:
          - /bookings
          - /v1/bookings

  - name: booking-service-docs
    service: booking-service
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: booking-swagger-ui
        strip_path: false
        preserve_host: false
        paths:
          - /swagger/booking-service
    plugins:
      - name: ip-restriction
        config:
          allow:
            - 127.0.0.1 # your own machine (localhost)
            - 192.168.1.0/24

plugins:
  # CORS Plugin (global)
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      exposed_headers:
        - "*"
      credentials: false
      max_age: 3600
      preflight_continue: false

  # Request ID
  - name: request-id
    config:
      header_name: X-Request-ID
      include_in_response: true

  # Response Transformer (add headers)
  - name: response-transformer
    config:
      add:
        headers:
          - X-Powered-By:Drive-Master-Gateway

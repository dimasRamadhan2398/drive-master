_format_version: "3.0"
_transform: true

services:
  # ========================
  # User Service (Port 8001)
  # ========================
  - name: user-service
    url: http://user-service:8001
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: user-auth-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/auth

      - name: user-users-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/users

      - name: user-members-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/members

      - name: user-instructors-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/instructors

  # User Service Swagger Docs
  - name: user-service-docs
    url: http://user-service:8001
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: user-swagger-ui
        strip_path: true
        preserve_host: false
        paths:
          - /swagger/user-service

  # ========================
  # Core Service (Port 8002)
  # ========================
  - name: core-service
    url: http://core-service:8002
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: core-cars-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/cars

      - name: core-packages-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/packages

      - name: core-articles-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/articles

      - name: core-testimonials-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/testimonials

  # Core Service Swagger Docs
  - name: core-service-docs
    url: http://core-service:8002
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: core-swagger-ui
        strip_path: true
        preserve_host: false
        paths:
          - /swagger/core-service

  # ========================
  # Booking Service (Port 8003)
  # ========================
  - name: booking-service
    url: http://booking-service:8003
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: booking-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/bookings

  # Booking Service Swagger Docs
  - name: booking-service-docs
    url: http://booking-service:8003
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: booking-swagger-ui
        strip_path: true
        preserve_host: false
        paths:
          - /swagger/booking-service

plugins:
  # CORS Plugin (global)
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      exposed_headers:
        - "*"
      credentials: false
      max_age: 3600
      preflight_continue: false
_format_version: "3.0"
_transform: true

# ==================== Upstreams ====================
upstreams:
  # User Service Upstream
  - name: user-service-upstream
    algorithm: round-robin
    slots: 10000
    healthchecks:
      threshold: 3
      active:
        timeout: 2s
        interval: 5s
        http_path: /health
        healthy:
          interval: 5s
          successes: 2
        unhealthy:
          interval: 5s
          tcp_failures: 2
          timeouts: 3
          http_failures: 3
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          tcp_failures: 2
          timeouts: 3
          http_failures: 3
    targets:
      - target: user-service:8001
        weight: 100
    tags:
      - drive-master
      - user-service

  # Core Service Upstream
  - name: core-service-upstream
    algorithm: round-robin
    slots: 10000
    healthchecks:
      threshold: 3
      active:
        timeout: 2s
        interval: 5s
        http_path: /health
        healthy:
          interval: 5s
          successes: 2
        unhealthy:
          interval: 5s
          tcp_failures: 2
          timeouts: 3
          http_failures: 3
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          tcp_failures: 2
          timeouts: 3
          http_failures: 3
    targets:
      - target: core-service:8002
        weight: 100
    tags:
      - drive-master
      - core-service

  # Booking Service Upstream
  - name: booking-service-upstream
    algorithm: round-robin
    slots: 10000
    healthchecks:
      threshold: 3
      active:
        timeout: 2s
        interval: 5s
        http_path: /health
        healthy:
          interval: 5s
          successes: 2
        unhealthy:
          interval: 5s
          tcp_failures: 2
          timeouts: 3
          http_failures: 3
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          tcp_failures: 2
          timeouts: 3
          http_failures: 3
    targets:
      - target: booking-service:8003
        weight: 100
    tags:
      - drive-master
      - booking-service

# ==================== Services ====================
services:
  # User Service
  - name: user-service
    url: http://user-service-upstream
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: user-service-route
        strip_path: false
        paths:
          - /user-service
          - /api/v1/users
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - X-Request-ID
          credentials: true
          max_age: 3600

  # Core Service
  - name: core-service
    url: http://core-service-upstream
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: core-service-route
        strip_path: false
        paths:
          - /core-service
          - /api/v1/core
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - X-Request-ID
          credentials: true
          max_age: 3600

  # Booking Service
  - name: booking-service
    url: http://booking-service-upstream
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: booking-service-route
        strip_path: false
        paths:
          - /booking-service
          - /api/v1/bookings
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
          exposed_headers:
            - X-Request-ID
          credentials: true
          max_age: 3600

# ==================== Global Plugins ====================
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600

  # Rate Limiting
  - name: rate-limiting
    config:
      minute: 1000
      hour: 10000
      day: 100000
      limit_by: ip
      policy: local

  # Request ID Generator
  - name: request-id
    config:
      header_name: X-Request-ID
      include_in_header: true
      include_in_body: false

  # Request/Response Transform
  - name: response-transformer
    config:
      add:
        headers:
          - X-Powered-By:Drive-Master-Gateway

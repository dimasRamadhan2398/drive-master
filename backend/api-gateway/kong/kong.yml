_format_version: "3.0"
_transform: true

services:
  # User Service API
  - name: user-service
    url: http://user-service:8001
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: user-api
        strip_path: false
        preserve_host: false
        paths:
          - /users
          - /auth

  # User Service Swagger Docs
  - name: user-service-docs
    url: http://user-service:8001/swagger/
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: user-swagger-ui
        strip_path: true
        preserve_host: false
        paths:
          - /swagger/user-service

  # Core Service API
  - name: core-service
    url: http://core-service:8002
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: core-service-route
        strip_path: false
        preserve_host: false
        paths:
          - /cars
          - /packages
          - /articles
          - /testimonials
          - /v1/cars
          - /v1/packages
          - /v1/articles
          - /v1/testimonials

  # Core Service Swagger Docs
  - name: core-service-docs
    url: http://core-service:8002/swagger/
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: core-swagger-ui
        strip_path: true
        preserve_host: false
        paths:
          - /swagger/core-service

  # Booking Service API
  - name: booking-service
    url: http://booking-service:8003
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: booking-service-route
        strip_path: true
        preserve_host: false
        paths:
          - /bookings
          - /v1/bookings

  # Booking Service Swagger Docs
  - name: booking-service-docs
    url: http://booking-service:8003/swagger/
    connect_timeout: 5000
    write_timeout: 10000
    read_timeout: 30000
    retries: 3
    routes:
      - name: booking-swagger-ui
        strip_path: true
        preserve_host: false
        paths:
          - /swagger/booking-service
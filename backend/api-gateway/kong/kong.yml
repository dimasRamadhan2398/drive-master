_format_version: "3.0"
_transform: true

# Kong Configuration
# All CORS handling is managed by Kong gateway using global cors plugin
# Services do NOT have CORS middleware - Kong handles all CORS responses

# ── Global plugins ────────────────────────────────────
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - X-Request-ID
        - X-User-ID
        - X-User-Role
      exposed_headers:
        - X-Request-ID
        - Content-Length
        - Authorization
      credentials: true
      max_age: 3600
      preflight_continue: false

# ── Upstreams ──────────────────────────────────────────
upstreams:
  - name: user-service-upstream
    targets:
      - target: user-service:8001
        weight: 100

  - name: core-service-upstream
    targets:
      - target: core-service:8002
        weight: 100

  - name: booking-service-upstream
    targets:
      - target: booking-service:8003
        weight: 100

  - name: payment-service-upstream
    targets:
      - target: payment-service:8004
        weight: 100

services:
  # ========================
  # User Service (Port 8001)
  # ========================
  - name: user-service
    url: http://user-service-upstream
    routes:
      - name: user-auth-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/auth
        protocols: [http, https]

      - name: user-users-route
        strip_path: false
        preserve_host: false
        paths:
          - /api/v1/users
        protocols: [http, https]

      - name: user-members-route

api-gateway:
  build:
    context: ./api-gateway
    dockerfile: Dockerfile
  ports:
    - "8080:8080"
  environment:
    - CONFIG_PATH=./pkg/config/config.yaml
    - GIN_MODE=release
  volumes:
    # Optional: mount config for development
    - ./api-gateway/pkg/config/config.yaml:/app/pkg/config/config.yaml:ro
  depends_on:
    - user-service
    - other-services

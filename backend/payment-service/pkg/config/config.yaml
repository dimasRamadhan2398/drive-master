server:
  port: 8004
  mode: debug
  read_timeout: 60

database:
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  username: ${POSTGRES_USER:-admin_drive}
  password: ${POSTGRES_PASSWORD:-drivemaster123}
  name: ${POSTGRES_DB:-drivemaster_payment_service}
  sslmode: disable
  max_open_connections: 10
  max_life_time_connection: 10
  max_idle_connections: 10
  max_idle_time: 10

redis:
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: 0

jwt:
  secret: your-secret-key-here
  expiry_hour: 24
  refresh_token_expiry_days: 7

log:
  level: info
  format: json

kafka:
  enabled: false
  brokers:
    - localhost:29092
  topic: payment.events
  service_name: payment-service

app:
  app_name: payment_service
  app_env: development
  signature_key: baf8f21c59948f5731ece01240fb303a8744e668a0befff55a63a3eb7022d8c9
  rate_limiter_max: 100
  rate_limiter_time: 1

midtrans:
  server_key: ${MIDTRANS_SERVER_KEY}
  client_key: ${MIDTRANS_CLIENT_KEY}
  environment: ${MIDTRANS_ENVIRONMENT:-sandbox}
  merchant_id: "M243240030"
  base_url: https://api.midtrans.com
  snap_url: https://app.midtrans.com/snap/snap.js
  enabled: true
  notification_url: ${MIDTRANS_NOTIFICATION_URL:-http://localhost:8080/notifications}
  timeout_seconds: 30
  gopay_callback_url: "localhost:3000/payment/success"

name: CI and Deploy

on:
  push:
    branches: [ zeta-v3 ]
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (frontend)
        run: |
          npm ci

      - name: Build frontend
        run: |
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: .output

  build-backend:
    runs-on: ubuntu-latest
    needs: build-frontend
    strategy:
      matrix:
        service: [user-service, core-service, api-gateway]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }} && go build -v -o bin/${{ matrix.service }} ./cmd

      - name: Upload backend binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-binaries-${{ matrix.service }}
          path: backend/${{ matrix.service }}/bin

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: github.ref == 'refs/heads/zeta-v3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries-user-service
      - name: Download backend core
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries-core-service
      - name: Download backend api-gateway
        uses: actions/download-artifact@v4
        with:
          name: backend-binaries-api-gateway

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}
        run: |
          rsync -avz -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" ./docker-compose.yml ${SSH_USER}@${SSH_HOST}:${SSH_TARGET_PATH}/
          rsync -avz -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" .output ${SSH_USER}@${SSH_HOST}:${SSH_TARGET_PATH}/frontend/
          rsync -avz -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" backend/*/bin ${SSH_USER}@${SSH_HOST}:${SSH_TARGET_PATH}/backend/

      - name: Run remote deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET_PATH: ${{ secrets.SSH_TARGET_PATH }}
        run: |
          ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} 'bash -s' < ./scripts/remote-deploy.sh
